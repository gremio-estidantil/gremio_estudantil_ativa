<!doctype html>
<html lang="pt-BR">
  <head>
     <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
     <title>Portal do Grêmio Estudantil</title>
     <style>
         :root{color-scheme:light dark;--bg:light-dark(#fff7fc,#180b22);--surface:light-dark(#fff,#281038);--surface2:light-dark(#f5e5fa,#39134b);--text:light-dark(#291033,#fff7ff);--muted:light-dark(#765d80,#d0b4db);--line:light-dark(#e7c9f0,#60336f);--brand:#6d168f;--brand2:#3d0758;--accent:#f4d9ff;--good:#17815d;--warn:#ad6811;--bad:#bb3c4a;--shadow:0 12px 32px #26072f20}
         *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}.top{background:linear-gradient(110deg,#260536,#4c0b6b 58%,#8a155e);color:white;padding:18px max(20px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:4px solid #f2b900}.brand{display:flex;gap:12px;align-items:center; min-width: 0; flex: 1; flex-shrink: 1}.logo{width:65px; height:65px; flex-shrink: 0; overflow: hidden; padding: 0; border-radius: 10%;}.logo img{width: 100%; height: 100%; object-fit: contain; display: block;}.brand > div:last-child {min-width:0;}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;margin:4px 0 0}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top button{border:1px solid #ffffff70;color:white;background:#ffffff14;border-radius:10px;padding:9px 12px}.top button.active{background:#f5c928;color:#30083e;border-color:#f5c928}.shell{max-width:1180px;margin:auto;padding:26px 20px 60px}.hero{background:linear-gradient(125deg,#2b063d 0%,#65118b 57%,#a51b66 100%);border:2px solid #f3bf19;border-radius:22px;padding:30px;color:white;display:grid;grid-template-columns:1.4fr .6fr;gap:20px;align-items:center;box-shadow:var(--shadow)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;opacity:.8}.hero h2{font-size:clamp(26px,4vw,42px);line-height:1.08;letter-spacing:-.04em;margin:10px 0}.hero p{max-width:650px;color:#f3defb;margin:0 0 18px}.hero-art{font-size:100px;text-align:center;filter:drop-shadow(0 12px 14px #17051e88)}.btn{border:0;background:linear-gradient(120deg,#6d168f,#a51b66);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--bad)}.btn.small{font-size:12px;padding:6px 9px}.btn.light{background:#f5c928;color:#30083e}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 0 4px;margin-bottom:20px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:10px 14px;border-radius:999px;font-weight:700}.tab.active{background:linear-gradient(120deg,#6d168f,#a51b66);border-color:#6d168f;color:white}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:26px 0 14px;flex-wrap:wrap}.section-head h2{margin:0;font-size:23px;letter-spacing:-.03em}.section-head p{margin:3px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}.card h3{font-size:17px;margin:0 0 7px}.card p{margin:7px 0;color:var(--muted)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.pill{display:inline-flex;align-items:center;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:11px;padding:5px 9px;font-weight:800}.pill.blue{background:light-dark(#f3dfff,#49205a);color:light-dark(#5b1377,#f0caff)}.pill.green{background:light-dark(#e0f6ec,#153b30);color:light-dark(#13714e,#91e1bd)}.pill.orange{background:light-dark(#fff0d9,#49351d);color:light-dark(#8d5609,#ffd08a)}.muted{color:var(--muted)}.meta{font-size:12px;color:var(--muted)}.news-card{display:flex;flex-direction:column;min-height:190px}.news-card .card-actions{margin-top:auto;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap}.icon-tile{height:42px;width:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:22px;flex-shrink:0}.row{display:flex;align-items:flex-start;gap:12px}.row .grow{flex:1;min-width:0}.list{display:grid;gap:10px}.list-item{display:flex;align-items:flex-start;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px}.list-item .grow{flex:1;min-width:0}.list-item h4{margin:0 0 4px}.list-item p{margin:0;color:var(--muted);font-size:13px}.photo{width:100%;height:160px;object-fit:cover;border-radius:11px;background:var(--surface2)}.photo-placeholder{height:160px;border-radius:11px;background:linear-gradient(135deg,#f0caff,#f8d5e9);display:grid;place-items:center;font-size:42px;color:#6d168f}.gallery-card{overflow:hidden}.gallery-card h3{margin-top:10px}.empty{padding:35px 18px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:5px}.form-card{max-width:760px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:13px;font-weight:750}.field input,.field textarea,.field select,.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);color:var(--text);outline:none}.field input:focus,.field textarea:focus,.field select:focus,.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px #8c25a622}.field textarea{min-height:105px;resize:vertical}.field small{color:var(--muted)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px 14px;background:var(--surface2);border-radius:11px;color:var(--muted);font-size:13px;margin-bottom:14px}.stat{font-size:28px;font-weight:850;letter-spacing:-.04em}.stat-label{font-size:12px;color:var(--muted)}.admin-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:light-dark(#f3dfff,#39134b);border:1px solid light-dark(#dfb7ef,#60336f);padding:15px 17px;border-radius:14px;margin-bottom:18px}.admin-banner strong{display:block}.admin-banner span{font-size:12px;color:var(--muted)}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:16px 0}.status-select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);max-width:160px}.poll-option{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--bg);color:var(--text);margin-top:8px}.poll-option:hover{border-color:var(--brand)}.poll-option:disabled{cursor:default}.bar{height:7px;border-radius:20px;background:var(--surface2);overflow:hidden;margin-top:7px}.bar span{height:100%;display:block;background:linear-gradient(90deg,#6d168f,#f0b900);border-radius:20px}.footer{border-top:1px solid var(--line);padding:20px;text-align:center;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#30083e;color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:20;max-width:90vw;border:1px solid #f2c51b}.modal-backdrop{position:fixed;inset:0;background:#16051dcc;display:grid;place-items:center;padding:18px;z-index:15}.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(460px,100%);box-shadow:0 20px 80px #0004}.modal h2{margin-top:0}.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.checkline{display:flex;gap:9px;align-items:center;font-size:13px}.checkline input{width:auto}.small-note{font-size:12px;color:var(--muted)}.mobile-menu{display:none}
         @media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero-art{display:none}.shell{padding:18px 14px 45px}.top{padding:15px}.form-row{grid-template-columns:1fr}}
         @media(max-width:520px){.grid,.grid.two{grid-template-columns:1fr}.brand h1{font-size:15px}.top-actions button{padding:8px}.hero{padding:23px}.hero h2{font-size:30px}.section-head h2{font-size:21px}};
         @media (max-width: 520px) {.top {padding: 16px; flex-direction: column; align-items: stretch; gap: 14px;}.brand {align-items: flex-start; min-width: 0;}.brand > div:last-child {min-width: 0;}.brand h1 {font-size: 17px; line-height: 1.3; overflow-wrap: anywhere;}.brand p {font-size: 12px; line-height: 1.5;}.top-actions {display: grid; grid-template-columns: 1fr; width: 100%; gap: 10px;}.top-actions button {width: 100%; padding: 12px; white-space: normal; line-height: 1.4;}.hero {grid-template-columns: 1fr; padding: 20px;}.hero h2 {font-size: 28px; line-height: 1.25;overflow-wrap: anywhere;}.modal {width: 100%;max-height: 85vh; overflow-y: auto; padding: 18px;}.modal-actions {flex-direction: column;}.modal-actions button {width: 100%;}}
@media screen and (max-width: 520px) {
  .top {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 16px;
    padding: 18px 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .brand > div:last-child {
    min-width: 0;
    flex: 1;
  }
  .brand h1 {
    font-size: 20px;
    line-height: 1.3;
    overflow-wrap: break-word;
  }
  .brand p {
    font-size: 13px;
    line-height: 1.5;
  }
  .top-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .top-actions button {
    width: 100%;
    padding: 12px;
    white-space: normal;
  }
  .nav {
    display: flex;
    gap: 8px;
    max-width: 100%;
    overflow-x: auto;
    padding-bottom: 12px;
  }
  .nav button,
  .nav a {
    flex-shrink: 0;
    white-space: nowrap;
  }
  .shell {
    padding: 18px 14px 35px;
  }
  .hero {
    grid-template-columns: minmax(0, 1fr);
    padding: 22px 18px;
  }
  .hero h2 {
    font-size: 30px;
    line-height: 1.25;
    overflow-wrap: break-word;
  }
  .hero p {
    line-height: 1.6;
  }
  .grid,
  .grid.two,
  .form-row {
    grid-template-columns: minmax(0, 1fr);
  }
  .modal {
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 18px;
  }
  .modal-actions {
    flex-direction: column;
  }
  .modal-actions button {
    width: 100%;
  }
  html,
  body {
    max-width: 100%;
    overflow-x: hidden;
  }
}
     </style>
   </head>
<body>
    <div class="app" id="app">
  <header class="top">
      <div class="brand">
      <div class="logo">
         <img src="index.jpeg" alt="Escudo do Grêmio">
      </div>
      <div>
         <h1>Portal do Grêmio Estudantil</h1>
         <p>Informação • participação • voz estudantil</p>
      </div>
      </div>
      <div class="top-actions">
         <button class="active" id="studentMode">👥 Área dos alunos</button>
         <button id="adminMode">🔐 Área administrativa</button>    
      </div>
  </header>
  <main class="shell" id="main"></main> 
  <footer class="footer">Portal do Grêmio Estudantil Exelencia A.T.I.V.A. Respeite a privacidade e a convivência escolar.</footer>
     </div>
     <div id="modalRoot"></div>
     <div id="toastRoot"></div>
     <script>
         (()=>{'use strict';
         const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const now=()=>new Date().toISOString().slice(0,10); const fmt=d=>{if(!d)return 'Sem data';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).replace('.','')};
        const starter={news:[{id:1,title:'Bem-vindos ao portal do grêmio!',category:'Comunicado',date:now(),summary:'Este será o espaço oficial para acompanhar novidades, projetos e ações dos representantes estudantis.',body:'Acompanhe as atualizações e participe enviando sugestões pela ouvidoria.',featured:true},{id:2,title:'Miniteste da semana: desafio do conhecimento',category:'Miniteste',date:now(),summary:'Prepare-se para o próximo desafio! Em breve, novas perguntas e atividades para movimentar a semana.',body:'Fique atento aos avisos dos professores e confira as próximas atividades.',featured:false}],events:[{id:1,title:'Reunião aberta do grêmio',date:now(),time:'12:00',place:'Pátio da escola',description:'Encontro para apresentar ideias e ouvir sugestões dos estudantes.',type:'Reunião'}],photos:[],messages:[],polls:[{id:1,title:'Qual atividade você gostaria de ver na escola?',options:['Campeonato esportivo','Feira cultural','Sessão de cinema','Oficinas e clubes'],votes:[0,0,0,0],voted:false,active:true}],proposals:[{id:1,title:'Criar um calendário de atividades estudantis',description:'Reunir datas importantes e eventos em um só lugar.',status:'Em análise',date:now(),author:'Grêmio'}],opportunities:[{id:1,title:'Mural de oportunidades',description:'Use este espaço para divulgar olimpíadas, concursos, cursos gratuitos e projetos educacionais.',date:now()}],sports:[{id:1,title:'Organização das atividades esportivas',description:'Consulte aqui os horários, inscrições e resultados dos campeonatos escolares.',date:now(),type:'Aviso'}],accounts:[{id:1,title:'Prestação de contas e transparência',description:'Publique aqui relatórios e informações sobre recursos e ações, quando aplicável.',date:now()}]};
        let data;try{data=JSON.parse(localStorage.getItem('gremioPortalData'))||structuredClone(starter)}catch(e){data=JSON.parse(JSON.stringify(starter))}let mode='student',tab='inicio',adminLogged=false,searchText='';
        function save(){try{localStorage.setItem('gremioPortalData',JSON.stringify(data))}catch(e){toast('Não foi possível salvar neste navegador.')}}
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function id(){return Date.now()+Math.floor(Math.random()*1000)}
function blank(title,desc=''){return `<div class="empty"><strong>${esc(title)}</strong>${esc(desc)}</div>`}
function section(title,desc='',right=''){return `<div class="section-head"><div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${right}</div>`}
function btn(label,action,cls='secondary'){return `<button class="btn ${cls}" data-action="${action}">${label}</button>`}
function studentHero(){return `<section class="hero"><div><div class="eyebrow">A escola também é sua</div><h2>Uma escola melhor começa com a sua voz.</h2><p>Fique por dentro das novidades, participe das decisões e acompanhe as ações do Grêmio Estudantil.</p><div style="display:flex;gap:9px;flex-wrap:wrap">${btn('Enviar uma sugestão','goto-ouvidoria','light')}${btn('Ver próximas atividades','goto-agenda','secondary')}</div></div><div class="hero-art">🎓</div></section>`}
const studentTabs=[['inicio','⌂','Início'],['noticias','▤','Notícias'],['ouvidoria','✉','Ouvidoria'],['fotos','▧','Fotos'],['agenda','▦','Agenda'],['enquetes','◉','Enquetes'],['esportes','⚽','Esportes'],['oportunidades','✦','Oportunidades'],['propostas','☷','Propostas'],['transparencia','◈','Transparência']];
function nav(){return `<nav class="tabs">${(mode==='student'?studentTabs:[['painel','▦','Painel'],['gerenciar-noticias','▤','Notícias'],['gerenciar-eventos','▦','Eventos'],['gerenciar-fotos','▧','Fotos'],['gerenciar-ouvidoria','✉','Ouvidoria'],['gerenciar-enquetes','◉','Enquetes'],['gerenciar-propostas','☷','Propostas'],['gerenciar-outros','✦','Outros conteúdos']]).map(t=>`<button class="tab ${tab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]} ${t[2]}</button>`).join('')}</nav>`}
function newsCards(limit=9){let list=[...data.news].sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(searchText)list=list.filter(n=>(n.title+' '+n.summary+' '+n.category).toLowerCase().includes(searchText.toLowerCase()));list=list.slice(0,limit);if(!list.length)return blank('Nenhuma notícia encontrada','Tente outra busca ou volte mais tarde.');return `<div class="grid">${list.map(n=>`<article class="card news-card"><div class="card-top"><span class="pill blue">${esc(n.category||'Notícia')}</span><span class="meta">${fmt(n.date)}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.summary||n.body||'')}</p><div class="card-actions">${btn('Ler notícia','read-news-'+n.id,'secondary small')}</div></article>`).join('')}</div>`}
function eventList(limit=20){let list=[...data.events].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,limit);if(!list.length)return blank('Nenhuma atividade cadastrada','As próximas atividades aparecerão aqui.');return `<div class="list">${list.map(e=>`<div class="list-item"><div class="icon-tile">📅</div><div class="grow"><div class="card-top"><span class="pill blue">${esc(e.type||'Evento')}</span><span class="meta">${fmt(e.date)}${e.time?' · '+esc(e.time):''}</span></div><h4>${esc(e.title)}</h4><p>${esc(e.description||'')}${e.place?' · '+esc(e.place):''}</p></div></div>`).join('')}</div>`}
function gallery(){if(!data.photos.length)return blank('A galeria está esperando por você','As fotos dos eventos e projetos serão publicadas aqui.');return `<div class="grid">${data.photos.map(p=>`<article class="card gallery-card">${p.src?`<img class="photo" src="${p.src}" alt="${esc(p.title)}">`:`<div class="photo-placeholder">📷</div>`}<h3>${esc(p.title)}</h3><p>${esc(p.caption||'') } <span class="meta">${fmt(p.date)}</span></p></article>`).join('')}</div>`}
function polls(){const active=data.polls.filter(p=>p.active!==false);if(!active.length)return blank('Nenhuma enquete aberta','Volte depois para participar das próximas votações.');return `<div class="grid two">${active.map(p=>{let total=p.votes.reduce((a,b)=>a+b,0);return `<article class="card"><div class="card-top"><span class="pill blue">Enquete</span><span class="meta">${total} voto(s)</span></div><h3>${esc(p.title)}</h3>${p.options.map((o,i)=>`<button class="poll-option" data-action="vote-${p.id}-${i}" ${p.voted?'disabled':''}>${esc(o)}${p.voted?`<span style="float:right">${total?Math.round(p.votes[i]/total*100):0}%</span>`:''}${p.voted?`<div class="bar"><span style="width:${total?p.votes[i]/total*100:0}%"></span></div>`:''}</button>`).join('')}${p.voted?'<p class="small-note">Obrigado por participar! Neste protótipo, o voto fica marcado neste navegador.</p>':''}</article>`}).join('')}</div>`}
function proposals(){if(!data.proposals.length)return blank('Nenhuma proposta publicada','As ideias e seu andamento aparecerão aqui.');return `<div class="list">${data.proposals.map(p=>`<div class="list-item"><div class="icon-tile">💡</div><div class="grow"><div class="card-top"><span class="pill ${p.status==='Concluída'?'green':p.status==='Em andamento'?'blue':'orange'}">${esc(p.status)}</span><span class="meta">${fmt(p.date)}</span></div><h4>${esc(p.title)}</h4><p>${esc(p.description||'')}</p></div></div>`).join('')}</div>`}
function simpleList(key,icon,emptyTitle,emptyDesc){let list=data[key]||[];if(!list.length)return blank(emptyTitle,emptyDesc);return `<div class="grid two">${list.map(x=>`<div class="card"><div class="row"><div class="icon-tile">${icon}</div><div class="grow"><h3>${esc(x.title)}</h3><p>${esc(x.description||'')}</p><span class="meta">${fmt(x.date)}</span></div></div></div>`).join('')}</div>`}
function studentContent(){let html='';switch(tab){case'inicio':html=studentHero()+section('Últimas notícias','O que está acontecendo na escola.',btn('Ver todas','goto-noticias','secondary'))+newsCards(3)+section('Próximas atividades','Marque na agenda e participe.')+eventList(3)+section('Participe','Sua opinião ajuda a construir uma escola melhor.')+`<div class="grid two"><div class="card"><div class="row"><div class="icon-tile">💬</div><div class="grow"><h3>Ouvidoria estudantil</h3><p>Envie sugestões, elogios ou reclamações com respeito e responsabilidade.</p>${btn('Falar com o grêmio','goto-ouvidoria')}</div></div></div><div class="card"><div class="row"><div class="icon-tile">🗳️</div><div class="grow"><h3>Enquetes abertas</h3><p>Ajude a escolher as próximas atividades e projetos.</p>${btn('Participar','goto-enquetes')}</div></div></div></div>`;break;
case'noticias':html=section('Notícias e atualizações','Manchetes, comunicados, minitestes e informações importantes.')+`<input class="search" id="newsSearch" placeholder="🔎 Buscar notícias..." value="${esc(searchText)}" style="margin-bottom:15px;max-width:500px">`+newsCards(100);break;
case'ouvidoria':html=section('Ouvidoria estudantil','Este é um canal de escuta. Escreva com respeito e não inclua dados pessoais desnecessários.')+`<div class="card form-card"><div class="notice">🔒 Envie uma sugestão, elogio, pedido ou reclamação. No protótipo, as mensagens ficam salvas apenas neste navegador e podem ser vistas na área administrativa deste mesmo navegador.</div><form id="feedbackForm"><div class="field"><label for="kind">Tipo de mensagem</label><select id="kind" required><option>Sugestão</option><option>Elogio</option><option>Reclamação</option><option>Pedido</option><option>Outro</option></select></div><div class="field"><label for="subject">Assunto</label><input id="subject" maxlength="100" required placeholder="Ex.: melhoria da quadra"></div><div class="field"><label for="message">Sua mensagem</label><textarea id="message" maxlength="2000" required placeholder="Conte sua ideia ou explique a situação..."></textarea></div><label class="checkline"><input id="anonymous" type="checkbox" checked> Quero enviar anonimamente</label><div class="field" id="nameField" style="margin-top:12px"><label for="sender">Nome (opcional)</label><input id="sender" maxlength="80" placeholder="Como podemos chamar você?"></div><button class="btn" type="submit">Enviar mensagem ↗</button></form></div>`;break;
case'fotos':html=section('Galeria de fotos','Registros de eventos, projetos e momentos da comunidade escolar.')+gallery();break;
case'agenda':html=section('Agenda escolar','Acompanhe reuniões, campeonatos, gincanas e outras atividades.')+eventList();break;
case'enquetes':html=section('Enquetes e votações','Participe das consultas estudantis.')+polls();break;
case'esportes':html=section('Esportes na escola','Informações sobre atividades, inscrições e competições.')+simpleList('sports','⚽','Nenhum aviso esportivo','Os avisos de esportes aparecerão aqui.');break;
case'oportunidades':html=section('Mural de oportunidades','Olimpíadas, concursos, cursos gratuitos e projetos educacionais.')+simpleList('opportunities','✨','Nenhuma oportunidade publicada','Novas oportunidades serão divulgadas aqui.');break;
case'propostas':html=section('Acompanhamento de propostas','Veja o andamento das ideias e melhorias sugeridas.')+proposals();break;
case'transparencia':html=section('Transparência do grêmio','Ações, projetos e prestação de contas, quando aplicável.')+simpleList('accounts','📊','Nenhum relatório publicado','Os relatórios e informes aparecerão aqui.');break;
}return html}
function adminContent(){if(!adminLogged)return `<div class="hero"><div><div class="eyebrow">Acesso restrito</div><h2>Área administrativa</h2><p>Organize as notícias, eventos, fotos e mensagens da comunidade escolar.</p><button class="btn light" data-action="login">Entrar no painel →</button></div><div class="hero-art">🔐</div></div><div class="notice" style="margin-top:16px"></div>`;
let html=`<div class="admin-banner"><div><strong>Modo administrador ativado</strong><span>Gerencie o conteúdo que aparece na área dos alunos.</span></div>${btn('Sair do painel','logout','secondary')}</div>`;
switch(tab){case'painel':html+=section('Visão geral','Resumo do conteúdo cadastrado.');html+=`<div class="grid">${[['📰',data.news.length,'Notícias'],['📅',data.events.length,'Eventos'],['📷',data.photos.length,'Fotos'],['✉️',data.messages.filter(m=>m.status!=='Respondida').length,'Mensagens pendentes'],['🗳️',data.polls.length,'Enquetes'],['💡',data.proposals.length,'Propostas']].map(s=>`<div class="card"><div class="card-top"><span class="icon-tile">${s[0]}</span><span class="stat">${s[1]}</span></div><div class="stat-label">${s[2]}</div></div>`).join('')}</div>`+section('Atalhos','Escolha o que deseja atualizar.')+`<div class="grid two">${[['gerenciar-noticias','📰','Publicar notícia'],['gerenciar-eventos','📅','Adicionar evento'],['gerenciar-fotos','📷','Adicionar foto'],['gerenciar-ouvidoria','✉️','Ver ouvidoria'],['gerenciar-enquetes','🗳️','Criar enquete'],['gerenciar-propostas','💡','Atualizar propostas']].map(x=>`<div class="card"><div class="row"><div class="icon-tile">${x[1]}</div><div class="grow"><h3>${x[2]}</h3>${btn('Abrir','tab-'+x[0],'secondary small')}</div></div></div>`).join('')}</div>`;break;
case'gerenciar-noticias':html+=section('Gerenciar notícias','Crie, edite e remova publicações.')+`<div class="card form-card"><h3>Nova notícia</h3><form id="newsForm"><div class="field"><label>Título</label><input name="title" maxlength="140" required placeholder="Manchete da notícia"></div><div class="form-row"><div class="field"><label>Categoria</label><select name="category"><option>Comunicado</option><option>Notícia</option><option>Miniteste</option><option>Aviso escolar</option><option>Projeto</option></select></div><div class="field"><label>Data</label><input type="date" name="date" value="${now()}" required></div></div><div class="field"><label>Resumo</label><textarea name="summary" maxlength="400" required placeholder="Um resumo que aparece no cartão"></textarea></div><div class="field"><label>Conteúdo completo (opcional)</label><textarea name="body" placeholder="Detalhes da notícia"></textarea></div><button class="btn">Publicar notícia</button></form></div><div class="divider"></div>${data.news.length?`<div class="list">${data.news.map(n=>`<div class="list-item"><div class="icon-tile">📰</div><div class="grow"><h4>${esc(n.title)}</h4><p>${esc(n.category)} · ${fmt(n.date)}</p></div>${btn('Excluir','delete-news-'+n.id,'danger small')}</div>`).join('')}</div>`:blank('Sem notícias','Publique a primeira notícia acima.')}`;break;
case'gerenciar-eventos':html+=section('Gerenciar eventos','Divulgue reuniões, campeonatos e atividades escolares.')+`<div class="card form-card"><h3>Novo evento</h3><form id="eventForm"><div class="field"><label>Nome do evento</label><input name="title" required maxlength="140"></div><div class="form-row"><div class="field"><label>Data</label><input type="date" name="date" required value="${now()}"></div><div class="field"><label>Horário</label><input type="time" name="time"></div></div><div class="form-row"><div class="field"><label>Local</label><input name="place" placeholder="Ex.: pátio"></div><div class="field"><label>Tipo</label><select name="type"><option>Evento</option><option>Reunião</option><option>Esporte</option><option>Gincana</option><option>Prazo</option></select></div></div><div class="field"><label>Descrição</label><textarea name="description"></textarea></div><button class="btn">Adicionar evento</button></form></div><div class="divider"></div>${eventList(100)}${data.events.map(e=>`<div style="margin-top:8px">${btn('Excluir: '+esc(e.title),'delete-event-'+e.id,'danger small')}</div>`).join('')}`;break;
case'gerenciar-fotos':html+=section('Gerenciar galeria','Envie uma imagem do dispositivo. Evite publicar fotos sem autorização.')+`<div class="card form-card"><form id="photoForm"><div class="field"><label>Título da foto</label><input name="title" required maxlength="100"></div><div class="field"><label>Legenda</label><input name="caption" maxlength="200"></div><div class="field"><label>Data</label><input type="date" name="date" value="${now()}" required></div><div class="field"><label>Arquivo de imagem</label><input type="file" name="file" accept="image/*" required><small>A imagem será redimensionada para reduzir o espaço usado no navegador.</small></div><button class="btn">Adicionar à galeria</button></form></div><div class="divider"></div>${data.photos.length?`<div class="list">${data.photos.map(p=>`<div class="list-item"><div class="icon-tile">📷</div><div class="grow"><h4>${esc(p.title)}</h4><p>${fmt(p.date)}</p></div>${btn('Excluir','delete-photo-'+p.id,'danger small')}</div>`).join('')}</div>`:blank('Galeria vazia','Adicione a primeira foto acima.')}`;break;
case'gerenciar-ouvidoria':html+=section('Mensagens da ouvidoria','Trate as mensagens com respeito e mantenha a confidencialidade.')+`<div class="notice">As mensagens deste protótipo ficam somente neste navegador. Não use este sistema para emergências ou para coletar dados sensíveis.</div>`+(data.messages.length?`<div class="list">${[...data.messages].reverse().map(m=>`<div class="card"><div class="card-top"><span class="pill blue">${esc(m.kind)}</span><span class="meta">${fmt(m.date)}</span></div><h3>${esc(m.subject)}</h3><p style="white-space:pre-wrap;color:var(--text)">${esc(m.message)}</p><p class="meta">Remetente: ${m.anonymous?'Anônimo':esc(m.sender||'Não informado')}</p><div class="divider"></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="small-note">Status:</label><select class="status-select" data-message-status="${m.id}">${['Recebida','Em análise','Respondida'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select>${btn('Excluir mensagem','delete-message-'+m.id,'danger small')}</div></div>`).join('')}</div>`:blank('Nenhuma mensagem recebida','As mensagens enviadas pelos alunos aparecerão aqui.'));break;
case'gerenciar-enquetes':html+=section('Gerenciar enquetes','Crie votações simples para ouvir os estudantes.')+`<div class="card form-card"><form id="pollForm"><div class="field"><label>Pergunta</label><input name="title" required maxlength="160"></div><div class="field"><label>Opções (uma por linha, mínimo 2)</label><textarea name="options" required placeholder="Campeonato esportivo\nFeira cultural\nSessão de cinema"></textarea></div><button class="btn">Criar enquete</button></form></div><div class="divider"></div>${data.polls.map(p=>`<div class="list-item"><div class="icon-tile">🗳️</div><div class="grow"><h4>${esc(p.title)}</h4><p>${p.votes.reduce((a,b)=>a+b,0)} voto(s) · ${p.active===false?'Encerrada':'Aberta'}</p></div>${btn(p.active===false?'Reabrir':'Encerrar','toggle-poll-'+p.id,'secondary small')}${btn('Excluir','delete-poll-'+p.id,'danger small')}</div>`).join('')}`;break;
case'gerenciar-propostas':html+=section('Gerenciar propostas','Registre sugestões e atualize o andamento das iniciativas.')+`<div class="card form-card"><form id="proposalForm"><div class="field"><label>Nome da proposta</label><input name="title" required maxlength="140"></div><div class="field"><label>Descrição</label><textarea name="description" required></textarea></div><div class="field"><label>Status inicial</label><select name="status"><option>Recebida</option><option>Em análise</option><option>Em andamento</option><option>Concluída</option></select></div><button class="btn">Adicionar proposta</button></form></div><div class="divider"></div>${data.proposals.map(p=>`<div class="list-item"><div class="icon-tile">💡</div><div class="grow"><h4>${esc(p.title)}</h4><p>${esc(p.description)}</p></div><select class="status-select" data-proposal-status="${p.id}">${['Recebida','Em análise','Em andamento','Concluída'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select>${btn('Excluir','delete-proposal-'+p.id,'danger small')}</div>`).join('')}`;break;
case'gerenciar-outros':html+=section('Outros conteúdos','Gerencie oportunidades, esportes e transparência.')+['opportunities','sports','accounts'].map((key,i)=>{let titles=['Oportunidade','Aviso esportivo','Informe de transparência'];return `<div class="card form-card" style="margin-bottom:14px"><h3>${titles[i]}</h3><form data-simple-form="${key}"><div class="field"><label>Título</label><input name="title" required maxlength="140"></div><div class="field"><label>Descrição</label><textarea name="description" required></textarea></div><button class="btn">Publicar</button></form><div class="divider"></div>${(data[key]||[]).map(x=>`<div class="list-item"><div class="grow"><h4>${esc(x.title)}</h4><p>${esc(x.description)}</p></div>${btn('Excluir','delete-'+key+'-'+x.id,'danger small')}</div>`).join('')}</div>`}).join('');break;
}return html}
function render(){ $('#studentMode').classList.toggle('active',mode==='student');$('#adminMode').classList.toggle('active',mode==='admin');$('#main').innerHTML=nav()+(mode==='student'?studentContent():adminContent()); }
function showModal(html) {
  $('#modalRoot').innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        ${html}
      </div>
    </div>
  `;
}
function login(){showModal(`<h2>Entrar no painel</h2><p class="muted">Digite a senha adiminitrativa para ter acesso as ferramentas de adm.</p><form id="loginForm"><div class="field"><label>Senha administrativa</label><input name="password" type="password" required autofocus placeholder="Digite a senha"></div><div class="modal-actions"><button type="button" class="btn secondary" data-action="close-modal">Cancelar</button><button class="btn" type="submit">Entrar</button></div></form>`)}
function switchTab(t){tab=t;searchText='';render();window.scrollTo({top:0,behavior:'smooth'})}
function removeItem(key,itemId){data[key]=data[key].filter(x=>String(x.id)!==String(itemId));save();render();toast('Conteúdo removido.')}
function handleAction(a){if(a==='login'){login();return}if(a==='logout'){adminLogged=false;mode='admin';tab='painel';render();return}if(a==='close-modal'){$('#modalRoot').innerHTML='';return}if(a.startsWith('goto-')){mode='student';switchTab(a.slice(5));return}if(a.startsWith('tab-')){switchTab(a.slice(4));return}if(a.startsWith('read-news-')){const n=data.news.find(x=>x.id==a.slice(10));if(n)showModal(`<span class="pill blue">${esc(n.category)}</span><h2>${esc(n.title)}</h2><p class="meta">${fmt(n.date)}</p><p style="white-space:pre-wrap">${esc(n.body||n.summary)}</p><div class="modal-actions"><button class="btn" data-action="close-modal">Fechar</button></div>`);return}if(a.startsWith('vote-')){const [,pid,oi]=a.split('-');const p=data.polls.find(x=>x.id==pid);if(p&&!p.voted){p.votes[Number(oi)]++;p.voted=true;save();render();toast('Voto registrado neste navegador.')}return}if(a.startsWith('delete-news-'))return confirmRemove('news',a.slice(12));if(a.startsWith('delete-event-'))return confirmRemove('events',a.slice(13));if(a.startsWith('delete-photo-'))return confirmRemove('photos',a.slice(13));if(a.startsWith('delete-message-'))return confirmRemove('messages',a.slice(15));if(a.startsWith('delete-poll-'))return confirmRemove('polls',a.slice(12));if(a.startsWith('delete-proposal-'))return confirmRemove('proposals',a.slice(16));for(const k of ['opportunities','sports','accounts'])if(a.startsWith('delete-'+k+'-'))return confirmRemove(k,a.slice(('delete-'+k+'-').length));if(a.startsWith('toggle-poll-')){let p=data.polls.find(x=>x.id==a.slice(12));if(p)p.active=p.active===false;save();render();return}}
function confirmRemove(key,itemId){showModal(`<h2>Excluir conteúdo?</h2><p class="muted">Essa ação remove o item desta página permanentimente.</p><div class="modal-actions"><button type="button" class="btn secondary" data-action="close-modal">Cancelar</button><button type="button" class="btn danger" data-action="confirm-delete-${key}-${itemId}">Excluir</button></div>`)}
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)handleAction(b.dataset.action);const t=e.target.closest('[data-tab]');if(t)switchTab(t.dataset.tab)});
$('#studentMode').onclick=()=>{mode='student';tab='inicio';searchText='';render()};$('#adminMode').onclick=()=>{mode='admin';tab=adminLogged?'painel':'painel';render()};
$('#main').addEventListener('input',e=>{if(e.target.id==='newsSearch'){searchText=e.target.value;const gridContainer=e.target.nextElementSibling;if(gridContainer){gridContainer.outerHTML=newsCards(100);}}});
$('#modalRoot').addEventListener('click', e => {if (e.target.classList.contains('modal-backdrop')) {$('#modalRoot').innerHTML = '';return;} const b = e.target.closest('[data-action]');if (!b) return;const a = b.dataset.action;if (a === 'close-modal') {$('#modalRoot').innerHTML = '';return;}if (a.startsWith('confirm-delete-')){const x = a.slice('confirm-delete-'.length);const idx = x.lastIndexOf('-');const key = x.slice(0, idx);const item = x.slice(idx + 1);if (data[key]) {removeItem(key, item);}$('#modalRoot').innerHTML = '';return;}handleAction(a);
});
$('#modalRoot').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='loginForm'){const pass=new FormData(e.target).get('password');if(pass==='ativa81648'){adminLogged=true;$('#modalRoot').innerHTML='';mode='admin';tab='painel';render();toast('Acesso de demonstração liberado.')}else toast('Senha incorreta.');}});
$('#main').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='feedbackForm'){data.messages.push({id:id(),kind:$('#kind').value,subject:$('#subject').value.trim(),message:$('#message').value.trim(),anonymous:$('#anonymous').checked,sender:$('#sender').value.trim(),date:now(),status:'Recebida'});save();f.reset();$('#anonymous').checked=true;toast('Mensagem enviada. Obrigado pela participação!');return}if(f.id==='newsForm'){data.news.unshift({id:id(),title:fd.get('title').trim(),category:fd.get('category'),date:fd.get('date'),summary:fd.get('summary').trim(),body:fd.get('body').trim()});save();render();toast('Notícia publicada.');return}if(f.id==='eventForm'){data.events.push({id:id(),title:fd.get('title').trim(),date:fd.get('date'),time:fd.get('time'),place:fd.get('place').trim(),type:fd.get('type'),description:fd.get('description').trim()});save();render();toast('Evento adicionado.');return}if(f.id==='photoForm'){const file=fd.get('file');if(!file||!file.size)return;try{const src=await resizeImage(file);data.photos.unshift({id:id(),title:fd.get('title').trim(),caption:fd.get('caption').trim(),date:fd.get('date'),src});save();render();toast('Foto adicionada à galeria.')}catch(err){toast('Não foi possível carregar esta imagem.')}return}if(f.id==='pollForm'){const options=fd.get('options').split('\n').map(x=>x.trim()).filter(Boolean);if(options.length<2){toast('Digite pelo menos duas opções.');return}data.polls.unshift({id:id(),title:fd.get('title').trim(),options,votes:options.map(()=>0),voted:false,active:true});save();render();toast('Enquete criada.');return}if(f.id==='proposalForm'){data.proposals.unshift({id:id(),title:fd.get('title').trim(),description:fd.get('description').trim(),status:fd.get('status'),date:now(),author:'Grêmio'});save();render();toast('Proposta adicionada.');return}if(f.dataset.simpleForm){const key=f.dataset.simpleForm;data[key].unshift({id:id(),title:fd.get('title').trim(),description:fd.get('description').trim(),date:now()});save();render();toast('Conteúdo publicado.')}});
$('#main').addEventListener('change',e=>{if(e.target.dataset.messageStatus){const m=data.messages.find(x=>String(x.id)===e.target.dataset.messageStatus);if(m){m.status=e.target.value;save();toast('Status atualizado.')}}if(e.target.dataset.proposalStatus){const p=data.proposals.find(x=>String(x.id)===e.target.dataset.proposalStatus);if(p){p.status=e.target.value;save();toast('Proposta atualizada.')}}if(e.target.id==='anonymous')$('#nameField').classList.toggle('hidden',e.target.checked)});
function resizeImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
render();
})();
</script></body></html>
